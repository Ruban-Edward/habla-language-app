<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Body — round friendly owl -->
  <circle cx="50" cy="54" r="40" fill="#ff7a59"/>
  <!-- Belly -->
  <ellipse cx="50" cy="64" rx="24" ry="20" fill="#ffe0d6"/>
  <!-- Left eye white -->
  <circle cx="37" cy="44" r="14" fill="#fff"/>
  <!-- Right eye white -->
  <circle cx="63" cy="44" r="14" fill="#fff"/>
  <!-- Left pupil -->
  <circle cx="39" cy="45" r="7" fill="#1d1b2e"/>
  <!-- Right pupil -->
  <circle cx="65" cy="45" r="7" fill="#1d1b2e"/>
  <!-- Left eye shine -->
  <circle cx="42" cy="42" r="2.5" fill="#fff"/>
  <!-- Right eye shine -->
  <circle cx="68" cy="42" r="2.5" fill="#fff"/>
  <!-- Beak -->
  <path d="M46 54 L50 61 L54 54Z" fill="#e8533a"/>
  <!-- Left ear tuft -->
  <path d="M22 22 Q28 30 34 26 Q26 18 22 22Z" fill="#ff7a59"/>
  <!-- Right ear tuft -->
  <path d="M78 22 Q72 30 66 26 Q74 18 78 22Z" fill="#ff7a59"/>
  <!-- Small speech bubble -->
  <rect x="70" y="8" width="24" height="16" rx="6" fill="#fff"/>
  <path d="M74 24 L70 28 L78 24Z" fill="#fff"/>
  <!-- "hi" text in speech bubble -->
  <text x="82" y="20" font-family="Arial,sans-serif" font-weight="800" font-size="11" fill="#ff7a59" text-anchor="middle">hi!</text>
  <!-- Smile line under beak -->
  <path d="M44 63 Q50 68 56 63" fill="none" stroke="#e8533a" stroke-width="2" stroke-linecap="round"/>
  <!-- Left wing -->
  <path d="M14 50 Q10 60 18 68 Q20 58 14 50Z" fill="#e8533a"/>
  <!-- Right wing -->
  <path d="M86 50 Q90 60 82 68 Q80 58 86 50Z" fill="#e8533a"/>
  <!-- Feet -->
  <ellipse cx="40" cy="92" rx="8" ry="4" fill="#e8533a"/>
  <ellipse cx="60" cy="92" rx="8" ry="4" fill="#e8533a"/>
</svg>
